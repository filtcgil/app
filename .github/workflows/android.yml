name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install JS dependencies
        run: npm install

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clean Android build
        working-directory: ./android
        run: ./gradlew clean

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --no-parallel --max-workers=1 -Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.http.connectionTimeout=120000

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: UnionHub-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build Release APK
        working-directory: ./android
        run: ./gradlew assembleRelease --no-daemon --no-parallel --max-workers=1 -Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.http.connectionTimeout=120000

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: UnionHub-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
