apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

android {
    namespace "com.unionhub.app"
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.unionhub.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile(
                "proguard-android-optimize.txt"
            ), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }
}

/**
 * 🔴 BLOCCO CRITICO
 * Forza versioni compatibili con compileSdk 33
 * Evita errore: androidx.activity:activity:1.8.0 → SDK 34
 */
configurations.all {
    resolutionStrategy {
        force "androidx.activity:activity:1.7.2"
        force "androidx.activity:activity-ktx:1.7.2"
    }
}

dependencies {
    implementation("com.google.android.material:material:1.11.0")
    // React Native gestisce le dipendenze automaticamente
}
