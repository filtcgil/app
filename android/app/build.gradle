apply plugin: "com.android.application"
apply plugin: "kotlin-android"

// Applicazione del React Native CLI
apply from: "../../node_modules/react-native/react.gradle"

android {
    namespace "com.unionhub.app"
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.unionhub.app"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"

    // Librerie necessarie per React Native
    implementation "com.facebook.react:react-android"  // Sarà risolto dal react.gradle
    implementation 'com.google.android.material:material:1.9.0'
}
