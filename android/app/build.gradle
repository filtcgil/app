apply plugin: "com.android.application"

android {
    namespace "com.unionhub.app"
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.unionhub.app"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation("com.facebook.react:react-native:0.71.11")
}
